# dsh-codex-mode bundle patch.
#
# Registers the OpenAI model routes on the HOST plane (the same two rows the
# web profile patch used to carry by hand):
#   - `openai-official`  — chat-completions wire (apply_patch as JSON function)
#   - `openai-responses` — Responses API wire, codex's own protocol (apply_patch
#     as a true freeform custom tool with codex's lark grammar)
#
# Install:
#   dsh plugin --profile web add github:<owner>/dsh-codex-mode
#   # or, for local development:
#   dsh plugin --profile web add file:D:/Data/DEV/dsh/dsh-codex-mode
#
# Installing this bundle also publishes the AGENT PRESETS: the
# `codex-preset-publisher` host row copies agent-presets/codex and
# agent-presets/codex-creative into $DSH_HOME/.agent-presets as real
# directories (junctions are invisible to scanRoot). Tool rows in those
# presets resolve through this package's exports, so a marketplace
# install does not need install.ps1.
#
# ── EXACTLY ONE client-bearing row ─────────────────────────────────────────
# client-modules reads a row's package root out of the row's module location
# (`locatePkgJson` → `nearestPackage`). A BARE PACKAGE SUBPATH returns
# `undefined` immediately there, but a PATH-LIKE specifier (`./plugins/x.js`,
# `file:…/x.js`) resolves to the nearest ancestor manifest — which for every
# row in this patch is THIS package. Seven path-like rows therefore register
# seven sources for one packageName and the registry refuses to compose:
#
#   client-modules: package dsh-codex-mode resolves from multiple active
#   Loader sources: …; remove one entry
#
# That is a hard boot failure, not a silent no-UI. So: the six host rows use
# bare package SUBPATHS (no client source), and `codex-preset-publisher` — the
# one row whose host half IS the package root export, plugins/preset-publisher.js
# — is mounted by BARE PACKAGE NAME and is the single row that composes
# plugins/client.js (设置 → Codex 子代理).
- insert:
    # Keep child preset restoration available even when a cold continuation
    # originates from a parent which does not mount the Codex tool adapter.
    - id: codex-typed-subagent-presets
      name: 'dsh-codex-mode/plugins/typed-subagent-presets.js'

    - id: codex-agent-types
      name: 'dsh-codex-mode/plugins/agent-types.js'

    - id: llm-openai
      name: 'dsh-codex-mode/plugins/llm-openai.js'
      config:
        apiKeyEnv: OPENAI_API_KEY
        baseURL: 'https://api.openai.com/v1'

    - id: llm-responses
      name: 'dsh-codex-mode/plugins/llm-responses.js'
      config:
        apiKeyEnv: OPENAI_API_KEY
        baseURL: 'https://api.openai.com/v1'

    # `tool-cordis` registers process-global inspect providers named
    # Service/Event/Builtin/Tool. The shipped `cordis` preset already owns
    # those ids, so a second creative preset that also mounts `tool-cordis`
    # would fail unless duplicate first-party registrations are skipped.
    - id: share-cordis-inspect
      name: 'dsh-codex-mode/plugins/tools/share-cordis-inspect.js'

    # BARE PACKAGE NAME ON PURPOSE — the single client-bearing row. Do not
    # rewrite this to './plugins/preset-publisher.js': that moves the package's
    # client composition onto a second source and fails the boot.
    - id: codex-preset-publisher
      name: 'dsh-codex-mode'

    # Windows atomic writes copy the target DACL then ReplaceFileW. On ReFS
    # (and NTFS files whose inherited ACL is only Modify, not WRITE_DAC)
    # that call fails with SetFileSecurityW EACCES (Win32 5) and apply_patch
    # / write / edit abort even though Node rename can still publish. This
    # row hooks ctx.fs.internals so a WRITE_DAC refusal falls back to
    # rename. Bump `?v=` after editing the file under a running dsh.
    - id: win32-atomic-write-fallback
      name: 'dsh-codex-mode/plugins/win32-atomic-write-fallback.js'
