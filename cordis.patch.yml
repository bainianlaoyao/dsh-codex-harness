# dsh-codex-mode bundle patch.
#
# Registers the OpenAI model routes on the HOST plane (the same two rows the
# web profile patch used to carry by hand):
#   - `openai-official`  — chat-completions wire (apply_patch as JSON function)
#   - `openai-responses` — Responses API wire, codex's own protocol (apply_patch
#     as a true freeform custom tool with codex's lark grammar)
#
# Install:
#   dsh plugin --profile web add github:<owner>/dsh-codex-mode
#   # or, for local development:
#   dsh plugin --profile web add file:D:/Data/DEV/dsh/dsh-codex-mode
#
# Installing this bundle also publishes the AGENT PRESET: the
# `codex-preset-publisher` host row copies agent-presets/codex into
# $DSH_HOME/.agent-presets/codex as a real directory (junctions are
# invisible to scanRoot). Tool rows in that preset resolve through this
# package's exports, so a marketplace install does not need install.ps1.
#
# NOTE: `name` resolves as a module specifier; when installed as a package the
# rows below resolve `./plugins/...` relative to this bundle. Verify with
# `dsh --profile web dump-config` after install (the working profile patch
# already carries these two rows under `./dsh-codex/...`; remove those first to
# avoid duplicate route registration).
- insert:
    - id: llm-openai
      name: './plugins/llm-openai.js'
      config:
        apiKeyEnv: OPENAI_API_KEY
        baseURL: 'https://api.openai.com/v1'

    - id: llm-responses
      name: './plugins/llm-responses.js'
      config:
        apiKeyEnv: OPENAI_API_KEY
        baseURL: 'https://api.openai.com/v1'

    - id: codex-preset-publisher
      name: './plugins/preset-publisher.js'
