# Lightweight Codex-shaped coding preset for DeepSeek Harness.
# DSH remains responsible for sandboxing, approvals, context, and compaction.
#
# Three DSH surfaces are mounted HERE rather than left to the host composition,
# because the web surface disables its host-plane copies (`dsh-web-app` patch)
# and a preset that omits them loses the surface silently:
#   * skills — `skill-filesystem` + `tool-skill`: the `<available_skills>`
#     catalog, the `skill` tool, and the `/` composer menu.
#   * goals — `command-goal` + `tool-goal`: `/goal` and the `create_goal` /
#     `get_goal` / `update_goal` tools.
#   * compaction — the `compaction` group: `/compact` and auto-compaction.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      You are a precise, pragmatic coding agent running in DeepSeek Harness.
      Work directly in the user's repository and carry requests through implementation and verification.

      Use `exec_command` and `write_stdin` for terminal work. Use `apply_patch` for file edits. Use `todo_write` to track substantial multi-step work. Use `ask_user_question` only for decisions that genuinely belong to the user. Delegate independent work to a background `subagent` (or `subagent_fork` to inherit this conversation), following up with `send_message`. Keep changes focused, inspect existing code before editing, and report test results and remaining limitations clearly.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 32768
    projectRootMarkers: ['.git']
    instructionFileCandidates: ['AGENTS.md']
    localInstructionFileCandidates: ['AGENTS.override.md']

# The host composition may expose a global bash tool. Keep the preset's
# terminal surface limited to exec_command/write_stdin where possible.
- id: tool-codex-restrict
  name: 'dsh-codex-mode/plugins/tools/restrict.js'

- id: exec-terminals
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        timeoutMs: 300000

    - id: tool-codex-exec
      name: 'dsh-codex-mode/plugins/tools/exec-command.js'
      config:
        backendType: shell

- id: tool-codex-apply-patch
  name: 'dsh-codex-mode/plugins/tools/apply-patch.js'

- id: tool-codex-view-image
  name: 'dsh-codex-mode/plugins/tools/view-image.js'

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── DSH-native collaboration tools ───────────────────────────────────────────
# plan / ask-user / delegation are DSH NATIVE tools. The web surface disables
# the host rows for them, so the preset mounts them per-session — the same
# rows the shipped `code` preset carries: `todo_write` (plan),
# `ask_user_question`, `subagent` / `subagent_fork`, `send_message`,
# `interrupt_agent`, `list_agents`.
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent-list-agents
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

- id: codex-typed-subagents
  name: 'dsh-codex-mode/plugins/typed-subagents.js'

# ── goals ───────────────────────────────────────────────────────────────────
# The web surface disables the host-plane `command-goal` / `tool-goal` rows
# (`dsh-web-app` patch, same reason as the skill rows above), so a preset that
# wants the goal surface MUST mount both itself. Without them the session has no
# `create_goal` / `get_goal` / `update_goal` and no `/goal`: a long-running
# objective can never be armed, and a session resumed after a restart has
# nothing driving it. The goal service and session driver stay on the host
# plane, where the Gateway can resolve them; these two rows register into THIS
# preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# DSH-native web_search. The host `tool-web` row is disabled on the web
# surface, so presets mount their own; the search provider resolves from the
# host (anysearch in this profile). fetch stays off (SSRF-safe, like the
# shipped presets).
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── skills ──────────────────────────────────────────────────────────────────
# The skill REGISTRY (`dsh-skill`) is a host-plane row that the web surface
# keeps mounted, so both rows below register into THIS preset's layer of it and
# need no realm. `skill-filesystem` contributes local-root discovery — the
# project roots (`<projectRoot>/.dsh/skills`, `<projectRoot>/.agents/skills`)
# and the user roots (`$DSH_HOME/skills`, `~/.agents/skills`) — and `tool-skill`
# gives the agent the catalog plus the loader. Without them the session has no
# skill surface at all: no `skill` tool, no catalog, and a `/` in the composer
# that lists nothing, because the web menu resolves through `skills/list` and
# that call fails when neither the preset nor the host composition mounts the
# registry. `codex 创造模式` (codex-creative) has carried these two rows since it
# started shipping skills; this preset was simply missing them.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── compaction ──────────────────────────────────────────────────────────────
# Native DSH compaction (manual `/compact` + auto pressure compaction) instead
# of a Codex-specific compactor. The web surface disables the host-plane rows
# (`compaction-basic` / `command-compact` / `tool-result-pruner`), so a preset
# that wants compaction MUST mount this group per-session — same shape as the
# shipped `code` preset. Without it, `/compact` is not registered at all and
# auto-compaction never runs.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
